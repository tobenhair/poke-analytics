name: Cardmarket ingestion spike

# Manual-only. Runs scripts/cardmarket-spike.mjs on a GitHub runner (which can
# reach downloads.s3.cardmarket.com) and uploads the results as artifacts, so the
# route can be validated without any local setup. Read-only: it never writes
# Supabase or the workbook. See ROADMAP "Automated ingestion".
on:
  workflow_dispatch:
    inputs:
      command:
        # Default to `both` so a plain "Run workflow" shows the actual data
        # (ids + Price + Set Value), not just the id matches. Pick another to
        # focus: kpi = box-price KPIs + liquidity flags; fields = raw price-field
        # coverage + language check; discover = id matches only; compare = data
        # using ids already saved in the map.
        description: 'What to run: both = ids + Price + Set Value (default) · kpi = box-price KPIs + thin-market flags · svcheck = Set Value avg30 vs trend vs low (graded-card effect) · fields = field coverage + language · discover = id matches only'
        type: choice
        default: both
        options: [both, kpi, svcheck, fields, discover, compare]
      price_field:
        description: 'Price guide field for Price and Set Value (avg30 = 30-day average, the canonical basis; also trend/avg/avg7/low)'
        type: string
        default: avg30

jobs:
  spike:
    name: Run spike (${{ inputs.command }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run spike
        env:
          CMD: ${{ inputs.command }}
          PRICE_FIELD: ${{ inputs.price_field }}
        run: |
          set -o pipefail
          # One process per invocation: `both` must be the script's own subcommand,
          # not discover+compare as two processes (compare would then start fresh
          # with no discovered ids and report 0 coverage). --price-field is ignored
          # by discover, so it is safe to pass for every command.
          node scripts/cardmarket-spike.mjs "$CMD" --price-field "$PRICE_FIELD" 2>&1 | tee spike-output.txt
      - name: Publish output to job summary
        if: always()
        run: |
          {
            echo '## Cardmarket spike output (`'"$CMD"'`)'
            echo '```'
            cat spike-output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CMD: ${{ inputs.command }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-spike-${{ inputs.command }}
          path: |
            spike-output.txt
            cardmarket-map.draft.json
          if-no-files-found: warn
          retention-days: 7
