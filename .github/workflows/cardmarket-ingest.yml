name: Cardmarket catalog sync

# The PRECOMPUTE half of the ingestion. The DAILY Price + Set Value snapshot is
# written inside Supabase by the `cardmarket-daily` Edge Function (scheduled by
# pg_cron — see supabase/cardmarket-cron.sql). This workflow runs the occasional,
# memory-heavy CATALOG SYNC: it reads Cardmarket's large singles bulk file and
# caches each tracked expansion's single-card ids into Supabase, so the Edge
# Function never has to. GitHub runners have the memory for that; the Edge
# runtime (~256 MB) does not.
#
# Scheduled weekly (catalogues change rarely) and runnable by hand for a backfill
# or a one-off manual snapshot. See scripts/cardmarket-ingest.mjs and SUPABASE.md.
#
# Requires two repository secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (Settings → Secrets → Actions)
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays ~04:17 UTC — refresh the catalog cache
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: refresh-catalog
        options:
          - refresh-catalog   # cache expansion → single-card ids (+ fill missing product ids)
          - backfill-ids      # one-time: resolve & write cardmarket_product_id onto DB products
          - snapshot          # manual fallback: write today's snapshot from Node (not the Edge Function)
      dry_run:
        description: 'Dry run — derive + print, write nothing'
        type: boolean
        default: false
      refresh:
        description: 'Bypass the 12h fetch cache'
        type: boolean
        default: false

concurrency:
  group: cardmarket-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Catalog sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          set -o pipefail
          ARGS=""
          # inputs.mode is empty on the scheduled run → default to refresh-catalog.
          case "${MODE:-refresh-catalog}" in
            backfill-ids)    ARGS="--backfill-ids" ;;
            snapshot)        ARGS="" ;;
            *)               ARGS="--refresh-catalog" ;;
          esac
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$REFRESH" = "true" ] && ARGS="$ARGS --refresh"
          node scripts/cardmarket-ingest.mjs $ARGS 2>&1 | tee ingest-output.txt
      - name: Publish output to job summary
        if: always()
        run: |
          {
            echo '## Cardmarket catalog sync'
            echo '```'
            cat ingest-output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
